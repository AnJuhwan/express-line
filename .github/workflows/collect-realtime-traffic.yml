name: Collect realtime traffic

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-realtime-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect current traffic
        run: npm run traffic:collect:ndjson
        env:
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          SEOUL_LINK_IDS: ${{ secrets.SEOUL_LINK_IDS }}
          TRAFFIC_TARGET_ROADS: ${{ vars.TRAFFIC_TARGET_ROADS || '올림픽대로,강변북로,수도권제1순환고속도로,남부순환로,신월여의지하도로' }}
          TRAFFIC_TARGET_REGIONS: ${{ vars.TRAFFIC_TARGET_REGIONS || '서울,인천' }}
          TRAFFIC_TARGET_SECTION_KEYWORDS: ${{ vars.TRAFFIC_TARGET_SECTION_KEYWORDS }}
          TRAFFIC_TARGET_LINK_IDS: ${{ vars.TRAFFIC_TARGET_LINK_IDS }}

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/.gitkeep
          find data -maxdepth 1 -name "realtime-traffic-*.ndjson" -exec git add {} +
          if git diff --cached --quiet; then
            echo "No realtime traffic changes to commit."
          else
            git commit -m "chore(data): append realtime traffic"
            git push
          fi
